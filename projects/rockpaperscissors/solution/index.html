<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="wrapper">
  <div class="buttons">
    <button class="rpsButton" value="Rock">✊</button>
    <button class="rpsButton" value="Paper">🤚</button>
    <button class="rpsButton" value="Scissors">✌</button>
  </div>
  <div class="resultContainer">
  <div id="player-score"></div>
  <div id="hands"></div>
  <div id="result"></div>
  <div id="stats-panel">
    <span id="stats-detail">胜: 0 / 负: 0 / 平: 0</span>
    <span id="stats-winrate">胜率: 0%</span>
  </div>
  <div class="action-buttons">
    <button id='endGameButton'>🔴</button>
    <button id='resetStatsButton'>重置统计</button>
  </div>
  </div>
  <div id="history-panel">
    <h3>回合历史</h3>
    <ul id="history-list"></ul>
  </div>
  </div>
  
  <script src="script.js"></script>
</body>

</html>
